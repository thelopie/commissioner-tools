<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- A private league tool: never indexed, never linked publicly. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="same-origin" />
    <!-- The league crest, cropped from the emblem. -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <!-- Safari's home-screen icon will not take a webp, so this one is a png. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>La Liga de Lopie</title>
    <!--
      Link previews. The site is noindex, but the address gets pasted into group
      chats and mail, and an unfurled card is where most of the league will first
      see it. The full lockup as jpeg: unfurlers are the one place webp still is
      not safe to assume.
    -->
    <meta property="og:title" content="La Liga de Lopie" />
    <meta
      property="og:description"
      content="Dues, prizes, weekly challenges, and the draft order, all in one place."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lopieleague.com/" />
    <meta property="og:image" content="https://lopieleague.com/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
