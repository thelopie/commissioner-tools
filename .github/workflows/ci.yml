name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs are useful after a dependency advisory lands.
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 22.13+ satisfies every transitive engine requirement; 22.12 warns.
          node-version: '22.13'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Validates the CloudFormation templates without AWS credentials: the stack
      # is deliberately account- and region-agnostic so this can run on every push.
      - name: Synthesize infrastructure
        run: npm run synth

      - name: Confirm no real credentials are committed
        run: |
          set -e
          # .env.example must stay placeholder-only. This repository is public, and
          # a real value slipping into it is the most likely way secrets leak.
          # Positive match on the expected placeholder rather than a negative
          # lookahead, which grep -E does not support.
          for key in YAHOO_CLIENT_ID YAHOO_CLIENT_SECRET; do
            if ! grep -qx "${key}=replace-me" .env.example; then
              echo "::error::.env.example ${key} is not the expected placeholder"
              exit 1
            fi
          done
          for key in SESSION_SECRET TOKEN_ENCRYPTION_KEY; do
            if ! grep -q "^${key}=replace-with-" .env.example; then
              echo "::error::.env.example ${key} is not the expected placeholder"
              exit 1
            fi
          done
          if [ -f .env ]; then
            echo "::error::.env is committed â€” it must never be"
            exit 1
          fi
          if ls certs/*.pem >/dev/null 2>&1; then
            echo "::error::a certificate is committed â€” certs/ must stay local"
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Advisories appear independently of code changes, so this does not gate a PR;
    # it reports so the result is visible without blocking unrelated work.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.13'
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Recorded so a known-and-accepted advisory is a stated decision rather
      # than something that quietly scrolled past in a log.
      - name: Note accepted advisories
        if: always()
        run: |
          cat <<'NOTE'
          Accepted advisory: GHSA-qwww-vcr4-c8h2 (react-router, RSC Mode CSRF Bypass).

          Not applicable here. It affects React Router's unstable RSC server mode;
          this frontend is a client-only SPA using BrowserRouter, with no RSC, no
          server-side loaders, and no router-handled actions. Every request that
          changes state goes through the API's own double-submit CSRF check.

          No fixed release exists in the 7.x line and 8.x is unpublished, so the
          only "fix" npm offers is 7.11.0 â€” which sits inside a far broader
          advisory range (6.0.0 - 7.17.0) and would be a net regression.

          Revisit when react-router >8.2.0 ships.
          NOTE
